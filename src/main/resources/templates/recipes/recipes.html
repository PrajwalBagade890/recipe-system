{% extends "base.html" %}{% block title %}Recipes{% endblock %}{% block content %}<div class="container"><div class="title"><div><small>RECIPE LIBRARY</small><h1>Explore Recipes</h1></div></div><form class="search"><input name="q" value="{{q or ''}}" placeholder="Search recipes..."><button class="btn">Search</button></form><div class="recipegrid">{% for r in recipes %}<a class="recipe" href="/recipes/{{r.id}}"><div class="recipeimg">🍽️</div><h3>{{r.name}}</h3><p>{{r.cuisine}} · {{r.diet}}</p><small>⏱ {{r.cookingTime}} min · {{r.difficulty}}</small></a>{% else %}<div class="empty">No recipes found.</div>{% endfor %}</div></div>{% endblock %}
